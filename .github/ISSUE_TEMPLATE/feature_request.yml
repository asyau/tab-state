name: 💡 Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you're in — e.g. "When I come back after a weekend I can't tell …"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried or considered instead?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I understand Tab State keeps browsing data on the user's device unless they turn a feature on, and new features need to keep that promise.
          required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - "No — just suggesting"
        - "Maybe, with some pointers"
        - "Yes, I'd like to open a pull request"
